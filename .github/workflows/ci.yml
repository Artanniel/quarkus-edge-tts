name: Quarkus Edge TTS CI
on:
  push:
    branches: [ main, m7-production ]
  pull_request:
    branches: [ main ]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
      - name: Cache Maven packages
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-m2-
      - name: Install Maven Wrapper
        run: ./mvnw -N io.takari:maven:wrapper -Dmaven=3.9.9
      - name: Build with Maven
        run: ./mvnw -B verify
      - name: Build native image
        run: ./mvnw -B package -Pnative -DskipTests
      - name: Upload artifact (native binary)
        uses: actions/upload-artifact@v4
        with:
          name: quarkus-edge-tts-native
          path: target/*-runner
