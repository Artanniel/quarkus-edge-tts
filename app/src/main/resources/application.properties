quarkus.application.name=quarkus-tts-hub
quarkus.application.version=1.0.0

quarkus.http.port=8080
quarkus.http.cors=true
quarkus.http.cors.origins=*
quarkus.http.cors.headers=accept, authorization, content-type, x-requested-with
quarkus.http.cors.methods=GET, POST, OPTIONS

# Database Connection to Postgres
quarkus.datasource.db-kind=postgresql
quarkus.datasource.jdbc.url=jdbc:postgresql://${POSTGRES_HOST:postgresql.production.svc.cluster.local}:${POSTGRES_PORT:5432}/${POSTGRES_DB:railway}
quarkus.datasource.username=${POSTGRES_USER:postgres}
quarkus.datasource.password=${POSTGRES_PASSWORD}
quarkus.datasource.jdbc.max-size=10
quarkus.datasource.jdbc.min-size=2
quarkus.datasource.jdbc.acquisition-timeout=10

# Disable automatic schema migration / ORM since we use raw Agroal DataSource
quarkus.hibernate-orm.enabled=false

# Logging
quarkus.log.level=INFO
quarkus.log.category."com.artanniel.tts".level=INFO
quarkus.log.console.format=%d{yyyy-MM-dd HH:mm:ss,SSS} %-5p [%c{3.}] (%t) %s%e%n
